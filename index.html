<!-- ============ SIDEBAR ============ -->

  <div class="brand">
    <a class="brand-mark" href="#/home" aria-label="Home">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#22d3ee"/>

      </svg>

      <strong>Inside an LLM</strong>
      <span>Interactive field guide</span>

      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

<!-- ============ MAIN ============ -->
<div class="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="crumbs" id="crumbs">
      <span class="crumb-part" id="crumbPart">Foundations</span>
      <svg class="crumb-sep" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="crumb-title" id="crumbTitle">Start here</span>
    </div>

    <div class="topbar-actions">
      <button class="search-trigger" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle light / dark">
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M12 2.6v2.4M12 19v2.4M2.6 12H5M19 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn voice-top" id="voiceTopBtn" aria-label="Read this page aloud" title="Read this page aloud">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="view" id="view" tabindex="-1"></main>

  <footer class="page-foot">
    <div class="pf-inner">
      <span>Inside an LLM · an interactive field guide</span>
      <div class="pf-nav">
        <button class="ghost-btn" id="prevBtn">← Previous</button>
        <button class="ghost-btn" id="nextBtn">Next →</button>
      </div>
    </div>
  </footer>
</div>

<!-- ============ VOICE DOCK ============ -->
<div class="voice-dock" id="voiceDock" aria-label="Voice narration controls">
  <div class="vd-glow" aria-hidden="true"></div>
  <div class="vd-main">
    <button class="vd-play" id="vdPlay" aria-label="Play narration">
      <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" fill="currentColor"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
    </button>
    <div class="vd-body">
      <div class="vd-title-row">
        <span class="vd-label" id="vdLabel">Narration</span>
        <div class="vd-wave" id="vdWave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="vd-track"><span id="vdFill"></span></div>
      <div class="vd-text" id="vdText">Press play to hear this chapter explained.</div>
    </div>
    <div class="vd-actions">
      <button class="vd-mini" id="vdBack" aria-label="Previous passage" title="Previous passage">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="vd-mini" id="vdFwd" aria-label="Next passage" title="Next passage">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="vd-mini" id="vdStop" aria-label="Stop" title="Stop">
        <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
      </button>
      <button class="vd-mini caret" id="vdMore" aria-label="Narration settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="vd-panel" id="vdPanel" hidden>
    <label class="vd-field">
      <span>Voice</span>
      <select id="vdVoice"></select>
    </label>
    <label class="vd-field">
      <span>Speed <b id="vdRateVal">1.0×</b></span>
      <input type="range" id="vdRate" min="0.6" max="1.6" step="0.05" value="1" />
    </label>
    <label class="vd-field">
      <span>Pitch <b id="vdPitchVal">1.0</b></span>
      <input type="range" id="vdPitch" min="0.7" max="1.4" step="0.05" value="1" />
    </label>
    <label class="vd-check">
      <input type="checkbox" id="vdAutoplay" />
      <span>Auto-play narration when a chapter opens</span>
    </label>
    <label class="vd-check">
      <input type="checkbox" id="vdFollow" checked />
      <span>Follow along (highlight &amp; auto-scroll)</span>
    </label>
    <div class="vd-note" id="vdNote"></div>
  </div>
</div>

<!-- ============ SEARCH ============ -->
<div class="modal" id="searchModal" hidden>
  <div class="modal-card">
    <div class="modal-input">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="Search chapters, terms and ideas…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="modal-results" id="searchResults"></div>
  </div>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span></div>
